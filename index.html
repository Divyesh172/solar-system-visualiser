<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Meet - Orbital Visualizer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
            <h2>Sky Meet 2026 - Prototype</h2>
            <h3 id="dateDisplay">Date: </h3>
            
            <input type="range" id="timeScrubber" min="0" max="364" value="0" style="width: 100%; margin-top: 10px;">
            <div style="margin-top: 10px;">
                <label><input type="checkbox" id="autoPlay" checked> Auto-Orbit</label>
            </div>
            <p>Drag to rotate | Scroll to zoom</p>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
